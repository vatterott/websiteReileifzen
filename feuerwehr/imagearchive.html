<div class="cms-page fw-archive-page">
    <h1>Bildarchiv</h1>
    <p>Historische und aktuelle Bilder der Freiwilligen Feuerwehr Reileifzen.<br>
       Wähle ein Jahrzehnt und blättere durch die Aufnahmen.</p>

    <div class="fw-decade-filter" id="fw-decade-filter">
        <button class="fw-decade-btn active" data-decade="aktuell">Aktuell</button>
        <button class="fw-decade-btn" data-decade="2000s">2000er</button>
        <button class="fw-decade-btn" data-decade="1990s">1990er</button>
        <button class="fw-decade-btn" data-decade="1980s">1980er</button>
        <button class="fw-decade-btn" data-decade="1970s">1970er</button>
        <button class="fw-decade-btn" data-decade="historic">Historisch</button>
    </div>

    <p class="fw-gallery-status" id="fw-gallery-status"></p>
    <div class="gaense-gallery-grid" id="fw-gallery-grid"></div>
    <button class="fw-load-more" id="fw-load-more" hidden>Mehr anzeigen</button>
</div>

<script>
(function () {
    var PAGE_SIZE = 24;
    var currentDecade = 'aktuell';
    var currentPage = 0;
    var currentItems = [];
    var allItems = [];

    function filterByDecade(decade) {
        return allItems.filter(function (item) { return item.category === decade; });
    }

    function renderPage(items, startIdx) {
        var grid = document.getElementById('fw-gallery-grid');
        var slice = items.slice(startIdx, startIdx + PAGE_SIZE);
        slice.forEach(function (item) {
            var fig = document.createElement('figure');
            if (item.type === 'video') {
                fig.classList.add('fw-video-item');
                var video = document.createElement('video');
                video.controls = true;
                video.preload = 'metadata';
                var source = document.createElement('source');
                source.src = 'feuerwehr/ImageArchive/' + item.filename;
                source.type = 'video/mp4';
                video.appendChild(source);
                var fallback = document.createElement('a');
                fallback.href = 'feuerwehr/ImageArchive/' + item.filename;
                fallback.setAttribute('download', '');
                fallback.textContent = 'Video herunterladen';
                video.appendChild(fallback);
                fig.appendChild(video);
            } else {
                var img = document.createElement('img');
                img.src = 'feuerwehr/ImageArchive/' + item.filename;
                img.alt = item.title;
                img.loading = 'lazy';
                fig.appendChild(img);
            }
            var cap = document.createElement('figcaption');
            cap.textContent = item.title;
            fig.appendChild(cap);
            grid.appendChild(fig);
        });
    }

    function updateStatus(shown, total) {
        var s = document.getElementById('fw-gallery-status');
        if (s) s.textContent = shown + ' von ' + total + ' Medien';
    }

    function showDecade(decade) {
        currentDecade = decade;
        currentPage = 0;
        currentItems = filterByDecade(decade);

        var grid = document.getElementById('fw-gallery-grid');
        grid.innerHTML = '';

        renderPage(currentItems, 0);
        currentPage = 1;

        var shown = Math.min(PAGE_SIZE, currentItems.length);
        updateStatus(shown, currentItems.length);

        var btn = document.getElementById('fw-load-more');
        btn.hidden = currentItems.length <= PAGE_SIZE;
    }

    function attachEventListeners() {
        // Decade filter buttons
        document.getElementById('fw-decade-filter').addEventListener('click', function (e) {
            var btn = e.target.closest('.fw-decade-btn');
            if (!btn) return;
            document.querySelectorAll('.fw-decade-btn').forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            showDecade(btn.getAttribute('data-decade'));
        });

        // Load more
        document.getElementById('fw-load-more').addEventListener('click', function () {
            var startIdx = currentPage * PAGE_SIZE;
            renderPage(currentItems, startIdx);
            currentPage++;
            var shown = Math.min(currentPage * PAGE_SIZE, currentItems.length);
            updateStatus(shown, currentItems.length);
            if (shown >= currentItems.length) {
                document.getElementById('fw-load-more').hidden = true;
            }
        });

        // Lightbox clicks (images only) – pass ALL image items so navigation
        // works across the full decade collection, not just the rendered batch.
        document.getElementById('fw-gallery-grid').addEventListener('click', function (e) {
            var img = e.target.closest('figure:not(.fw-video-item) img');
            if (!img) return;
            e.stopPropagation(); // prevent main.js document handler from overwriting

            var imageItems = currentItems.filter(function (item) { return item.type !== 'video'; });
            var clickedSrc = img.getAttribute('src');
            var idx = 0;
            for (var i = 0; i < imageItems.length; i++) {
                var expectedEnd = 'feuerwehr/ImageArchive/' + imageItems[i].filename;
                if (clickedSrc === expectedEnd || clickedSrc.endsWith('/' + imageItems[i].filename)) {
                    idx = i;
                    break;
                }
            }

            var lightboxImages = imageItems.map(function (item) {
                return { src: 'feuerwehr/ImageArchive/' + item.filename, alt: item.title };
            });

            if (typeof openGaenseLightbox === 'function') {
                openGaenseLightbox(lightboxImages[idx].src, lightboxImages[idx].alt, lightboxImages, idx);
            }
        });

        // Auto-load next DOM page when lightbox navigation nears the rendered boundary
        if (typeof registerLightboxLoadMoreCallback === 'function') {
            registerLightboxLoadMoreCallback(function (lightboxIdx) {
                var renderedImages = document.querySelectorAll('#fw-gallery-grid figure:not(.fw-video-item)').length;
                if (lightboxIdx >= renderedImages - 3 && currentPage * PAGE_SIZE < currentItems.length) {
                    var startIdx = currentPage * PAGE_SIZE;
                    renderPage(currentItems, startIdx);
                    currentPage++;
                    var shown = Math.min(currentPage * PAGE_SIZE, currentItems.length);
                    updateStatus(shown, currentItems.length);
                    if (shown >= currentItems.length) {
                        document.getElementById('fw-load-more').hidden = true;
                    }
                }
            });
        }
    }

    // Load media list from JSON, then initialise
    fetch('feuerwehr/ImageArchive/media.json')
        .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function (data) {
            allItems = data;
            attachEventListeners();
            showDecade('aktuell');
        })
        .catch(function () {
            var s = document.getElementById('fw-gallery-status');
            if (s) s.textContent = 'Fehler beim Laden der Mediendaten.';
        });
}());
</script>
